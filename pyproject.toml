[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c64sid"
version = "0.3.2"
description = "Python C64 SID playback, rendering, forensic-capture, and analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - license not yet selected" }
keywords = ["c64", "chiptune", "commodore-64", "psid", "rsid", "sid", "sound"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Repository = "https://github.com/djayuffe/c64sid_py_complete_FULL_FIX_v2"
Releases = "https://github.com/djayuffe/c64sid_py_complete_FULL_FIX_v2/releases"

[project.scripts]
c64sid-render = "sid_render:main"
c64sid-analyze = "tools.analyze_sid:main"
c64sid-visualize = "tools.visualize_sidpro:main"
c64sid-to-csv = "tools.sidpro_to_csv:main"
c64sid-inspect = "tools.inspect_sid:main"

[tool.setuptools]
py-modules = ["sid_render"]

[tool.setuptools.packages.find]
include = ["c64sid*", "tools*"]

[tool.setuptools.package-data]
"c64sid.sid.resid_lut" = ["*.dat"]

[tool.unittest]
start-directory = "tests"
