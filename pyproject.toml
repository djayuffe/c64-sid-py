[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c64sid"
version = "0.1.0"
description = "Experimental Python C64 SID playback and forensic-capture toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - license not yet selected" }

[tool.setuptools.packages.find]
include = ["c64sid*", "patches*"]

[tool.setuptools.package-data]
"c64sid.sid.resid_lut" = ["*.dat"]

[tool.unittest]
start-directory = "tests"
